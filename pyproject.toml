[project]
name = "chess"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elias Safo", email = "elias.safo@bonial.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "numpy>=2.5.3",
    "pyside6>=6.11.2",
    "python-chess>=1.2.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "zstandard>=0.25.0",
]

[project.scripts]
chess = "chess:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
